<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wedding Day</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; margin:0; padding:0; background:#f8f5f2; color:#222; }
    header { background:#fff; padding:2rem; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
    .container { max-width:900px; margin:2rem auto; padding:1rem; }
    .hero { text-align:center; padding:2rem; background:#fff; border-radius:8px; }
    .cta { display:inline-block; margin-top:1rem; padding:0.5rem 1rem; background:#e07a5f; color:#fff; border-radius:6px; text-decoration:none; }
    footer { text-align:center; padding:1rem; color:#666; font-size:0.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>Wedding Day</h1>
    <p>Chào mừng đến ngày đặc biệt của chúng tôi</p>
  </header>

  <main class="container">
    <section class="hero">
      <h2>Chúng tôi sẽ kết hôn!</h2>
      <p>Ngày: 2026-06-06 (ví dụ)</p>
      <a class="cta" href="#">Xem chi tiết</a>
    </section>

    <section style="margin-top:1.5rem; background:#fff; padding:1rem; border-radius:8px;">
      <h3>Thông tin thêm</h3>
      <p>Thêm địa điểm, giờ giấc, RSVP, và chỉ dẫn di chuyển ở đây.</p>
    </section>
  </main>

  <footer>
    &copy; 2026 Wedding Day
  </footer>
</body>
</html>
